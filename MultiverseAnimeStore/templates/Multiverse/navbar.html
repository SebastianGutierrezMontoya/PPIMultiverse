
        <nav class="navbar">
  <div class="navbar-container">

    <div class="navbar-logo" onclick="showSection('inicio')">
      <div class="navbar-logo-icon">
        <i class="fas fa-meteor"></i>
      </div>
      <div>
        <h1 class="navbar-title">Multiverse</h1>
        <span class="navbar-subtitle">Anime Store</span>
      </div>
    </div>

    <div class="navbar-menu">
      <a class="navbar-link" href="{% url 'home' %}">Inicio</a>
      <a class="navbar-link" href="{% url 'catalogo' %}">Catálogo</a>
      {% if user.is_authenticated %}
      <a class="navbar-link" href="{% url 'mis_pedidos' %}">Mis Pedidos</a>
      {% endif %}
      {% if user.is_authenticated and user.usuario_id_perfil_id == 1 %}
      <a class="navbar-link navbar-link-muted" href="{% url 'panel_dashboard' %}">Gestión</a>
      {% endif %}
    </div>

    <!-- ─── BARRA DE BÚSQUEDA ─── -->
    <form class="navbar-search" method="GET" action="{% url 'catalogo' %}">
      <input
        type="text"
        name="prod_nombre"
        class="navbar-search-input"
        placeholder="Buscar productos..."
        value=""
        aria-label="Buscar productos"
      />
      <button type="submit" class="navbar-search-btn" aria-label="Buscar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>

    <div class="navbar-actions">
      <button class="navbar-cart" onclick="toggleCart()" title="Ver carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </button>

      {% if user.is_authenticated %}
        <div style="display: flex; align-items: center; gap: 8px; margin-right: 12px; color: #94a3b8;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span style="font-size: 13px; font-weight: 600;">{{ user.nombre|default:user.id_usuario }}</span>
        </div>
        <a class="navbar-link navbar-link-muted" href="{% url 'logout' %}" style="font-size: 12px;">Salir</a>
      {% else %}
        <a class="navbar-link" href="{% url 'login' %}" style="font-size: 12px;">Ingresar</a>
      {% endif %}
    </div>

  </div>
</nav>
