{% extends "Admin/panel_base.html" %}
{% block panel_content %}
<div class="panel-content-header">
    <div><h2>Estados de Pedido</h2><p>Catálogo de estados.</p></div>
    <div class="panel-actions">
        <a href="{% url 'panel_estados_crear' %}" class="panel-btn panel-btn-primary">+ Nuevo Estado</a>
        <!-- <a href="{% url 'admin_home' %}" class="panel-btn panel-btn-secondary">↩️ Admin Clásico</a> -->
    </div>
</div>
{% if estados %}
<div class="panel-table-wrapper">
    <table class="panel-table">
        <thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead>
        <tbody>
            {% for e in estados %}
            <tr>
                <td style="color:#64748b; font-family:monospace;">{{ e.est_id }}</td>
                <td style="color:#ffffff; font-weight:600;">{{ e.est_nombre }}</td>
                <td>
                    <a href="{% url 'panel_estados_editar' e.est_id %}" class="panel-btn panel-btn-sm panel-btn-primary">Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}<div class="panel-alert panel-alert-info">No hay estados.</div>{% endif %}
{% endblock %}
