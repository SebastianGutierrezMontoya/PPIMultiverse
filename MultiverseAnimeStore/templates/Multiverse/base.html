{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Multiverse Anime Store</title>
        <link rel="stylesheet" href="{% static 'MultiverseAnimeStore/css/public-base.css' %}">
        <link rel="stylesheet" href="{% static 'MultiverseAnimeStore/css/navbar.css' %}">
        <link rel="stylesheet" href="{% static 'MultiverseAnimeStore/css/cart-sidebar.css' %}">
        <link rel="stylesheet" href="{% static 'MultiverseAnimeStore/css/catalogo.css' %}">
        <link rel="stylesheet" href="{% static 'MultiverseAnimeStore/css/forms.css' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        {% block extra_head %}{% endblock %}

    </head>
    <body>

        {% include 'Multiverse/navbar.html' %}
        {% include 'Multiverse/cart-sidebar.html' %}

    <main>

        {% if messages %}
        <div style="max-width: 960px; margin: 0 auto; padding: 20px 20px 0;">
            {% for message in messages %}
            <div style="padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 12px; {% if message.level_tag == 'success' %}background: rgba(34,197,94,0.1); color: #16a34a; border: 1px solid rgba(34,197,94,0.2);{% elif message.level_tag == 'error' %}background: rgba(239,68,68,0.1); color: #dc2626; border: 1px solid rgba(239,68,68,0.2);{% else %}background: rgba(243,125,21,0.1); color: #f37d15; border: 1px solid rgba(243,125,21,0.2);{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}

        

        {% endblock %}

    </main>

    

    <script>
        window.isAuthenticated = {% if user.is_authenticated %}true{% else %}false{% endif %};
    </script>
    <script src="{% static 'MultiverseAnimeStore/Js/cart-sidebar.js' %}"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (document.querySelector('.panel-wrapper')) return;
        document.querySelectorAll('input[required], select[required], textarea[required]').forEach(function(el) {
            if (el.closest('.form-floating')) return;
            var label = document.querySelector('label[for="' + el.id + '"]');
            if (label && !label.querySelector('.required-star')) {
                var star = document.createElement('span');
                star.className = 'required-star';
                star.textContent = ' *';
                star.style.color = '#ef4444';
                star.style.fontWeight = '900';
                label.appendChild(star);
            }
        });
    });
    </script>

    </body>

</html>
