{% extends "Admin/panel_base.html" %}
{% block panel_content %}
<div class="panel-content-header">
    <div><h2>Estados de Pedido</h2><p>Catálogo de estados.</p></div>
    <div class="panel-actions">

    </div>
</div>
{% if estados %}
<div class="panel-table-wrapper">
    <table class="panel-table">
        <thead><tr><th>ID</th><th>Nombre</th></tr></thead>
        <tbody>
            {% for e in estados %}
            <tr>
                <td style="color:#64748b; font-family:monospace;">{{ e.id_estado }}</td>
                <td style="color:#ffffff; font-weight:600;">{{ e.est_nombre }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}<div class="panel-alert panel-alert-info">No hay estados.</div>{% endif %}
{% endblock %}
