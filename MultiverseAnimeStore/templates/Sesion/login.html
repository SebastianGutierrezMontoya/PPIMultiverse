{% extends "Multiverse/base.html" %}
{% load static %}

{% block extra_head %}
<style>
    /* Estilo oscuro solo para esta página */
    #login-page-body {
        background-color: #0b0b0b;
        min-height: calc(100vh - 72px); /* Descontando la navbar */
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: #111;
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 28px;
        padding: 40px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .login-logo {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        background: transparent !important;
    }
    .login-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .login-title {
        text-align: center;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        color: #fff;
        margin-bottom: 30px;
    }
    .form-input {
        width: 100%;
        padding: 14px 20px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        color: #fff;
        margin-bottom: 20px;
        outline: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .btn-login {
        width: 100%;
        background: #f37d15;
        color: #fff;
        border: none;
        padding: 16px;
        border-radius: 14px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-login:hover {
        background: #000;
        color: #f37d15;
        box-shadow: 0 0 15px rgba(243, 125, 21, 0.2);
    }
</style>
{% endblock %}

{% block content %}
<div id="login-page-body">
    <div class="login-card">
        <div class="login-logo">
            <img src="{% static 'ICONO TIENDA.png' %}" alt="Logo">
        </div>
        <h2 class="login-title">Acceso Multiverso</h2>
        
        <form method="post">
            {% csrf_token %}
            <input type="text" name="usuario" class="form-input" placeholder="Usuario" required>
            <input type="password" name="contraseña" class="form-input" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        
        <p style="text-align:center; margin-top:20px; font-size:13px; color:#94a3b8;">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color:#f37d15; text-decoration:none; font-weight:700;">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
